[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epubtransform"
version = "0.1.0"
description = "EPUB transformation toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "litellm",
    "lxml",
    "fastapi",
    "pydantic",
    "boto3",
    "modal",
    "pymupdf",
    "uvicorn",
]

[project.scripts]
modernfiction = "modernfiction_v2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modernfiction_v2"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
