version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: modernfiction_postgres
    environment:
      POSTGRES_USER: modernfiction
      POSTGRES_PASSWORD: modernfiction
      POSTGRES_DB: modernfiction
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
