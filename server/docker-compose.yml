services:
  postgres:
    image: postgres:16-alpine
    container_name: modernfiction_postgres
    environment:
      POSTGRES_USER: modernfiction
      POSTGRES_PASSWORD: modernfiction
      POSTGRES_DB: modernfiction
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: modernfiction_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: modernfiction
      MINIO_ROOT_PASSWORD: modernfiction-password
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:4173,http://127.0.0.1:3000,http://127.0.0.1:4173"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: modernfiction_minio_init
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 modernfiction modernfiction-password; do
          sleep 1
        done
        mc mb --ignore-existing local/modernfiction
        mc anonymous set none local/modernfiction

volumes:
  postgres_data:
  minio_data:
